# ------------------------------------------------------------------ virtual queues
# One entry per VQ.  Field legend (all per queue):
#   weight               relative share of inbound arrivals (deliberately unbalanced)
#   open_hour/close_hour local opening window, close 24 = midnight; 0/24 = 24x7
#   days                 Mon-Sun | Mon-Sat | Mon-Fri
#   talk_median_s        median talk time (log-normal), talk_sigma its spread (0.4 tight, 0.8 wide)
#   hold_prob            probability of a hold on a normal call, hold_mean_s its mean length
#   acw_mean_s           mean after-call work
#   base_asa_s           average speed of answer when lightly loaded (drives service level)
#   patience_median_s    customer patience (log-normal median); lower => more abandons
#   patience_sigma       spread of patience
#   service_level_s      SL threshold for SERVICE_LEVEL_FLAG (answer within N seconds)
#   overflow_vq          backup queue after inbound.overflow_wait_s (null = none)
#   home_site            site reported on queue legs that never reached an agent
#   pbr_enabled          Predictive Behavioural Routing (skewed agent selection) vs plain ACD
#   pbr_skew             strength of the skew: 0 uniform, 0.5 mild, 1.0 strong, 1.2 extreme
#   pbr_premium_boost    extra concentration on top agents for VIP/Enterprise customers (1 = none)
#   short_abandon_prob, abandon_while_ringing_prob, rona_prob, ivr_contained_prob
#                        per-queue overrides of the global inbound/ivr values (null = use global)
#   wait_scale           multiplier on every drawn queue wait (1.5 = 50 % slower => more abandons)
