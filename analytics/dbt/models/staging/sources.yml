version: 2
sources:
- name: gim_raw
  schema: callcenter_analytics
  tables:
  - name: interaction_resource_fact
    description: One row per resource leg (agent, queue, IVR, external party, dialer)
      of a voice interaction - the Genesys Info Mart INTERACTION_RESOURCE_FACT grain.
      Partitioned by call_date.
    columns:
    - name: IRF_ID
      description: Surrogate key of the row, unique across the run.
    - name: INTERACTION_ID
      description: Interaction the leg belongs to; shared by all customer-facing legs
        of a call, consult legs get their own.
    - name: ROOT_INTERACTION_ID
      description: Interaction id of the customer call at the root of the tree; group
        by this to reassemble a full call including consults.
    - name: CALL_ID
      description: 16-hex ConnID-style identifier of this leg, unique per row.
    - name: CALL_DATE
      description: Business date of the root interaction (partition key); late legs
        of a call crossing midnight keep the root's date.
    - name: SEGMENT_SEQ
      description: 1-based order of the leg inside the root interaction tree in creation
        order.
    - name: PREVIOUS_CALL_ID
      description: CALL_ID of the leg that led to this one (previous agent for transfers
        / RONA re-queues, initiating leg for consults and conferences, initiator for
        internal calls); null when SEGMENT_SEQ = 1.
    - name: PARENT_INTERACTION_ID
      description: 'Consult legs only: the customer interaction from which the consult
        was made.'
    - name: PARENT_CALL_ID
      description: 'Consult legs only: the CALL_ID of the agent leg that initiated
        the consult.'
    - name: RELATED_INTERACTION_ID
      description: 'Callback legs only (CALLBACK_FLAG = 1): the inbound interaction
        in which the callback was requested.'
    - name: MEDIA_TYPE
      description: Always voice.
    - name: CALL_TYPE
      description: Inbound | Outbound | Internal | Consult.
    - name: RESOURCE_TYPE
      description: 'Resource the row describes: Agent | Queue (abandoned / callback
        requested, no agent) | IVR | External | Dialer.'
    - name: RESOURCE_ROLE
      description: Received | ReceivedTransfer | ReceivedConsult | ConferenceJoined
        | Initiated.
    - name: SCENARIO
      description: Generator label of the scenario that produced the leg (see docs/SCENARIOS.md);
        not present in a real Info Mart.
    - name: CALL_RESULT
      description: 'Business result of the leg: Answered, Abandoned, ShortAbandon,
        Transferred, Conferenced, RONA, SelfService, AfterHours, Voicemail, CallbackRequested,
        SystemError, NoAnswer, Busy, AnsweringMachine, Consulted, DialerDrop, Completed.'
    - name: CALL_RESULT_CODE
      description: Numeric code of CALL_RESULT (1 Answered ... 17 Completed).
    - name: TECHNICAL_RESULT
      description: 'Info Mart technical descriptor: Completed | Abandoned | Transferred
        | Conferenced | Redirected | Diverted | Failed.'
    - name: TECHNICAL_RESULT_REASON
      description: Reason detail, e.g. AnsweredByAgent, AbandonedWhileQueued, RouteOnNoAnswer,
        BlindTransfer, IVRContained, NoAgentAvailable.
    - name: DISCONNECT_REASON
      description: 'Who released the leg: Customer | Agent | System | Transfer; null
        on RONA legs.'
    - name: DISPOSITION
      description: Agent wrap-up code = primary BUSINESS_RESULT in interaction_outcome_fact;
        Transferred / Assisted / LeftMessage on legs without an outcome; null when
        no agent handled a customer.
    - name: CAMPAIGN_NAME
      description: Dialer campaign for outbound dialer legs.
    - name: ARRIVE_TIME
      description: 'Local start of the leg: arrival for root legs, moment of transfer
        / consult start / conference join / dial time otherwise.'
    - name: ARRIVE_TIME_UTC
      description: ARRIVE_TIME as a UTC instant.
    - name: ANSWER_TIME
      description: When the resource connected (ARRIVE_TIME + IVR + QUEUE + RING);
        null when not answered.
    - name: END_TIME
      description: When the leg was released (ANSWER_TIME + TALK + HOLD, or arrival
        + IVR + queue + ring for unanswered legs).
    - name: ACW_END_TIME
      description: END_TIME + ACW_TIME; null when ACW_TIME = 0.
    - name: IVR_TIME
      description: Seconds in IVR / announcement / voicemail before queuing.
    - name: QUEUE_TIME
      description: Seconds waiting in the VQ (time waited before hanging up for abandons;
        dialer hand-off delay for dialer legs).
    - name: RING_TIME
      description: Seconds the target resource was alerting (25 on RONA legs).
    - name: TALK_TIME
      description: Seconds connected excluding hold (conference initiators include
        the conference portion).
    - name: HOLD_TIME
      description: Seconds the customer was on hold, including consult time for legs
        that consulted.
    - name: HOLD_COUNT
      description: Number of holds.
    - name: ACW_TIME
      description: After-call work seconds.
    - name: DURATION
      description: END_TIME - ARRIVE_TIME in seconds (excludes ACW).
    - name: HANDLE_TIME
      description: TALK_TIME + HOLD_TIME + ACW_TIME.
    - name: INTERVAL_15MIN
      description: ARRIVE_TIME floored to the 15-minute interval (local).
    - name: ARRIVE_HOUR
      description: Local hour of ARRIVE_TIME (0-23).
    - name: ROUTE_POINT
      description: Route point DN the call entered on (the original VQ's for overflowed
        calls); null for direct DID / manual outbound / internal.
    - name: DNIS
      description: 'Number dialled: VQ DNIS for inbound, agent DID for direct / consult
        / internal, customer number for outbound.'
    - name: ANI
      description: 'Calling number: customer ANI for inbound, site CLI (or VQ DNIS
        for callbacks) for outbound, initiating agent id for consults, agent DID for
        internal.'
    - name: QUEUE_ID
      description: ACD queue DN behind the VQ.
    - name: QUEUE_NAME
      description: ACD queue name.
    - name: VQ_ID
      description: Virtual queue id.
    - name: VQ_NAME
      description: Virtual queue the leg was distributed from / worked in (the queue
        that finally handled an overflowed call); null for direct DID, manual outbound,
        internal, external legs.
    - name: ORIGINAL_VQ_NAME
      description: 'Set when the call overflowed: the VQ the customer originally queued
        in.'
    - name: SKILL
      description: Skill expression of the VQ.
    - name: ROUTING_METHOD
      description: 'How the resource was selected: ACD | PBR | Direct | Consult |
        Conference | Manual | Dialer | Internal | Callback; queue legs carry the VQ''s
        ACD/PBR; null on IVR / external legs.'
    - name: PBR_SCORE
      description: 'PBR-routed agent legs only: the selected agent''s PBR percentile
        score (0-1).'
    - name: AGENT_ID
      description: Agent employee id; null on Queue / IVR / External / Dialer legs.
    - name: AGENT_NAME
      description: Agent display name.
    - name: AGENT_GROUP
      description: Team, {LOB}_{SITE}_TEAMnn.
    - name: AGENT_TENURE_BAND
      description: <3m | 3-12m | 1-3y | 3y+.
    - name: SITE
      description: Agent's site, or the VQ's home site when no agent handled the leg;
        null for IVR self-service and external legs.
    - name: LOB
      description: Line of business of the VQ (or of the agent for direct / outbound
        / internal).
    - name: CUSTOMER_ID
      description: Customer key; null on consult and internal legs.
    - name: CUSTOMER_SEGMENT
      description: Consumer | SMB | Enterprise | VIP.
    - name: ANSWERED_FLAG
      description: Resource connected (has ANSWER_TIME).
    - name: ABANDON_FLAG
      description: Customer hung up before an agent connected (in queue or while ringing)
        or the dialer dropped the customer.
    - name: SHORT_ABANDON_FLAG
      description: Abandoned with QUEUE_TIME below short_abandon_threshold_s; excluded
        from service level.
    - name: RONA_FLAG
      description: Agent was alerted and did not answer (Redirect On No Answer).
    - name: OVERFLOW_FLAG
      description: Call was rerouted from ORIGINAL_VQ_NAME to VQ_NAME after waiting
        overflow_wait_s.
    - name: TRANSFER_FLAG
      description: This leg ended by transferring the customer onwards.
    - name: TRANSFER_IN_FLAG
      description: This leg received the customer via a transfer.
    - name: TRANSFER_TYPE
      description: Blind | Warm | External, on both the transferring and the receiving
        leg.
    - name: TRANSFER_TO
      description: 'On the transferring leg: target VQ name, target agent id or external
        number.'
    - name: TRANSFER_COUNT
      description: Transfers that occurred in the interaction before this leg began.
    - name: CONFERENCE_FLAG
      description: Leg took part in a conference (initiator and joined agent).
    - name: CONSULT_FLAG
      description: Agent on this leg initiated a consult (warm transfer, consult-only,
        conference set-up).
    - name: CONSULT_RECEIVED_FLAG
      description: This is the consult leg itself (CALL_TYPE = Consult).
    - name: CALLBACK_FLAG
      description: Outbound leg fulfilling a requested callback.
    - name: CALLBACK_REQUESTED_FLAG
      description: Inbound queue leg on which the customer accepted a callback offer.
    - name: SERVICE_LEVEL_FLAG
      description: 1 when QUEUE_TIME + RING_TIME <= the VQ's service_level_s, 0 otherwise;
        null when not applicable (short abandons, callbacks, direct / warm-received
        / consult / outbound legs).
    - name: FIRST_CALL_FLAG
      description: First contact of this customer in the generated period.
    - name: REPEAT_CALL_7D_FLAG
      description: Customer had another contact in the previous 7 days.
    - name: N_AGENT
      description: 'Agent parties on the leg: 0, 1 or 2 (consult, conference, internal).'
    - name: N_CUSTOMER
      description: 'Customer parties on the leg: 1 for customer-facing legs and connected
        outbound, else 0.'
    - name: _dataset_id
      description: User-supplied dataset identity; include in joins.
    - name: _load_id
      description: Attempt UUID; only completed attempts are staged.
    - name: _source_file
      description: Relative Parquet path.
    - name: _ingested_at
      description: UTC batch ingestion time.
    - name: _source_timezone
      description: Generator timezone from manifest.
  - name: interaction_outcome_fact
    description: 'Business outcomes recorded on handled customer legs (sale, saved,
      cancelled, resolved, payment, no change ...): one primary outcome per leg plus
      optional CrossSell secondary. Join to interaction_resource_fact on IRF_ID. Partitioned
      by call_date.'
    columns:
    - name: OUTCOME_ID
      description: Surrogate key, unique across the run.
    - name: IRF_ID
      description: The agent leg the outcome was recorded on (interaction_resource_fact.IRF_ID).
    - name: CALL_ID
      description: CALL_ID of that leg.
    - name: INTERACTION_ID
      description: INTERACTION_ID of that leg.
    - name: ROOT_INTERACTION_ID
      description: ROOT_INTERACTION_ID of that leg (whole-call grouping key).
    - name: CALL_DATE
      description: CALL_DATE of that leg (partition key).
    - name: OUTCOME_SEQ
      description: 1 = primary outcome (equals the leg's DISPOSITION), 2 = secondary
        CrossSell.
    - name: OUTCOME_TIME
      description: 'When the outcome happened: inside the conversation for monetary
        outcomes (and in_call_event_prob of the others), otherwise at wrap-up; always
        >= the leg''s ANSWER_TIME.'
    - name: OUTCOME_TIME_UTC
      description: OUTCOME_TIME as a UTC instant.
    - name: RECORDED_TIME
      description: 'When the agent coded the outcome: inside the ACW window (END_TIME..ACW_END_TIME)
        or at END_TIME when there is no ACW; always >= OUTCOME_TIME.'
    - name: IN_CALL_FLAG
      description: 1 when OUTCOME_TIME lies inside the talk (<= END_TIME).
    - name: CALL_TYPE
      description: CALL_TYPE of the leg.
    - name: SCENARIO
      description: SCENARIO of the leg.
    - name: LOB
      description: LOB whose outcome catalogue was used (VQ's LOB, or the agent's
        LOB for direct / manual outbound).
    - name: VQ_NAME
      description: VQ_NAME of the leg.
    - name: CAMPAIGN_NAME
      description: Dialer campaign of the leg, if any.
    - name: ROUTING_METHOD
      description: ROUTING_METHOD of the leg (ACD, PBR, Direct, Manual, Dialer, Callback).
    - name: AGENT_ID
      description: Agent who recorded the outcome (= the leg's agent).
    - name: AGENT_NAME
      description: Agent display name.
    - name: AGENT_GROUP
      description: Agent team.
    - name: AGENT_TENURE_BAND
      description: Agent tenure band.
    - name: AGENT_PBR_SCORE
      description: The agent's PBR percentile score (0-1) on every row regardless
        of routing method; the agent effect on outcomes is driven by the same latent
        quality.
    - name: SITE
      description: Agent site.
    - name: CUSTOMER_ID
      description: Customer key.
    - name: CUSTOMER_SEGMENT
      description: Consumer | SMB | Enterprise | VIP.
    - name: QUEUE_TIME
      description: QUEUE_TIME of the leg (seconds), for wait-effect analysis without
        a join.
    - name: TALK_TIME
      description: TALK_TIME of the leg (seconds).
    - name: HANDLE_TIME
      description: HANDLE_TIME of the leg (seconds).
    - name: OUTCOME_CATEGORY
      description: 'Roll-up: Sale | Retention | Churn | Service | Escalation | Billing
        | Collections | FollowUp | NoChange.'
    - name: BUSINESS_RESULT
      description: The outcome code from the LOB catalogue (Sale, NoSale, Saved, Cancelled,
        Downgraded, OfferDeclined, NoChange, Resolved, Escalated, FollowUp, PaymentTaken,
        PromiseToPay ...) or CrossSell on secondary rows.
    - name: OUTCOME_SUBTYPE
      description: 'Detail: product sold, save offer, cancel reason, resolution type,
        payment method, escalation target, cross-sell product; null when the outcome
        has no subtypes.'
    - name: OUTCOME_POLARITY
      description: Positive | Neutral | Negative.
    - name: OFFER_MADE_FLAG
      description: An offer was presented to the customer.
    - name: AMOUNT_TYPE
      description: Revenue | MRR_Retained | MRR_Lost | Payment | Credit | Promise;
        null when the outcome carries no money.
    - name: AMOUNT
      description: Positive amount in CURRENCY (direction given by AMOUNT_TYPE); present
        iff AMOUNT_TYPE.
    - name: CURRENCY
      description: ISO currency code of AMOUNT (outcomes.currency).
    - name: FOLLOW_UP_FLAG
      description: A case / task was created (scheduled callback, pending decision,
        escalation, dispute, dispatch, promise to pay, hardship referral).
    - name: CASE_ID
      description: Case / ticket id, present iff FOLLOW_UP_FLAG.
    - name: FOLLOW_UP_DUE_TIME
      description: When the follow-up is due (1-5 days after RECORDED_TIME at a business
        hour; 3-14 days for promises to pay).
    - name: _dataset_id
      description: User-supplied dataset identity; include in joins.
    - name: _load_id
      description: Attempt UUID; only completed attempts are staged.
    - name: _source_file
      description: Relative Parquet path.
    - name: _ingested_at
      description: UTC batch ingestion time.
    - name: _source_timezone
      description: Generator timezone from manifest.
  - name: dim_site
    description: Contact-centre sites (locations) agents work from.
    columns:
    - name: SITE
      description: Site name (primary key; joins interaction_resource_fact.SITE, dim_agent.SITE,
        dim_vq.HOME_SITE).
    - name: COUNTRY
      description: ISO country code of the site.
    - name: OFFSHORE_FLAG
      description: 1 for offshore sites, which staff most night shifts.
    - name: OUTBOUND_CLI
      description: Caller id presented on outbound calls from this site (ANI of outbound
        legs).
    - name: _dataset_id
      description: User-supplied dataset identity; include in joins.
    - name: _load_id
      description: Attempt UUID; only completed attempts are staged.
    - name: _source_file
      description: Relative Parquet path.
    - name: _ingested_at
      description: UTC batch ingestion time.
    - name: _source_timezone
      description: Generator timezone from manifest.
  - name: dim_lob
    description: Lines of business.
    columns:
    - name: LOB
      description: Line of business name (primary key; joins LOB on both facts, dim_vq.LOB,
        dim_agent.LOB).
    - name: LOB_SHORT
      description: Short code used in AGENT_GROUP names (SAL, RET, CS, TEC, BIL, COL).
    - name: _dataset_id
      description: User-supplied dataset identity; include in joins.
    - name: _load_id
      description: Attempt UUID; only completed attempts are staged.
    - name: _source_file
      description: Relative Parquet path.
    - name: _ingested_at
      description: UTC batch ingestion time.
    - name: _source_timezone
      description: Generator timezone from manifest.
  - name: dim_vq
    description: Virtual queues with their ACD queue, route point, DNIS, opening hours,
      routing method and expected AHT.
    columns:
    - name: VQ_ID
      description: Virtual queue id (primary key; joins interaction_resource_fact.VQ_ID).
    - name: VQ_NAME
      description: Virtual queue name (joins VQ_NAME / ORIGINAL_VQ_NAME / TRANSFER_TO
        on the fact).
    - name: QUEUE_ID
      description: ACD queue DN behind the VQ.
    - name: QUEUE_NAME
      description: ACD queue name.
    - name: ROUTE_POINT
      description: Route point DN calls to this VQ enter on.
    - name: DNIS
      description: Toll-free number dialled to reach this VQ.
    - name: LOB
      description: Line of business of the VQ.
    - name: SKILL
      description: Skill expression required to take calls from the VQ.
    - name: HOME_SITE
      description: Site reported on queue legs that never reached an agent.
    - name: OPEN_HOUR
      description: Local opening hour (0-23).
    - name: CLOSE_HOUR
      description: Local closing hour (1-24; 24 = midnight; OPEN 0 / CLOSE 24 = 24x7).
    - name: OPEN_DAYS
      description: Mon-Sun | Mon-Sat | Mon-Fri.
    - name: SERVICE_LEVEL_S
      description: Service-level threshold in seconds used for SERVICE_LEVEL_FLAG.
    - name: OVERFLOW_VQ_NAME
      description: Backup VQ calls overflow to after overflow_wait_s; null when none.
    - name: ROUTING_METHOD
      description: ACD (longest idle, uniform) or PBR (Predictive Behavioural Routing,
        skewed to high-scoring agents).
    - name: PBR_ENABLED_FLAG
      description: 1 when the VQ uses PBR.
    - name: PBR_SKEW
      description: 'Strength of the PBR skew: agent selection weight = exp(PBR_SKEW
        * agent quality z-score), i.e. the log-normal sigma of agent weights (0 =
        uniform, 1.2 = extreme); null for ACD queues.'
    - name: ROSTER_SIZE
      description: Number of agents skilled for the VQ (primary or secondary skill).
    - name: EXPECTED_AHT_S
      description: Expected average handle time in seconds used for staffing (talk
        + expected hold + ACW).
    - name: _dataset_id
      description: User-supplied dataset identity; include in joins.
    - name: _load_id
      description: Attempt UUID; only completed attempts are staged.
    - name: _source_file
      description: Relative Parquet path.
    - name: _ingested_at
      description: UTC batch ingestion time.
    - name: _source_timezone
      description: Generator timezone from manifest.
  - name: dim_agent
    description: 'Agent roster: team, site, LOB, skills, shift, days off, personal
      speed factor and PBR score.'
    columns:
    - name: AGENT_ID
      description: Agent employee id (primary key; joins AGENT_ID on both facts and
        TRANSFER_TO).
    - name: AGENT_NAME
      description: Display name.
    - name: AGENT_GROUP
      description: Team, {LOB}_{SITE}_TEAMnn.
    - name: SITE
      description: Site the agent works from.
    - name: LOB
      description: Line of business of the agent's primary skill.
    - name: AGENT_TENURE_BAND
      description: <3m | 3-12m | 1-3y | 3y+; newer agents are slower and have lower
        PBR quality on average.
    - name: PRIMARY_VQ_NAME
      description: VQ of the agent's primary skill.
    - name: SKILLS
      description: Pipe-separated skill expressions the agent carries (primary plus
        optional secondary in the same LOB).
    - name: SHIFT_START_HOUR
      description: Local hour the agent's shift starts (0-23).
    - name: SHIFT_LEN_H
      description: Shift length in hours.
    - name: DAYS_OFF
      description: Pipe-separated weekday names the agent does not work.
    - name: SPEED_FACTOR
      description: Multiplier on the agent's talk and ACW times (1.0 = average).
    - name: PBR_SCORE
      description: Percentile rank (0-1) of the agent's latent quality; drives PBR
        routing and the agent effect on business outcomes.
    - name: AGENT_DID
      description: Agent's direct-dial number (DNIS of direct / consult / internal
        legs).
    - name: _dataset_id
      description: User-supplied dataset identity; include in joins.
    - name: _load_id
      description: Attempt UUID; only completed attempts are staged.
    - name: _source_file
      description: Relative Parquet path.
    - name: _ingested_at
      description: UTC batch ingestion time.
    - name: _source_timezone
      description: Generator timezone from manifest.
  - name: dim_customer
    description: 'Customer pool: id, phone number (ANI) and segment.'
    columns:
    - name: CUSTOMER_ID
      description: Customer key (primary key; joins CUSTOMER_ID on both facts).
    - name: ANI
      description: Customer phone number (ANI of inbound legs, DNIS of outbound legs).
    - name: CUSTOMER_SEGMENT
      description: Consumer | SMB | Enterprise | VIP.
    - name: _dataset_id
      description: User-supplied dataset identity; include in joins.
    - name: _load_id
      description: Attempt UUID; only completed attempts are staged.
    - name: _source_file
      description: Relative Parquet path.
    - name: _ingested_at
      description: UTC batch ingestion time.
    - name: _source_timezone
      description: Generator timezone from manifest.
  - name: _dataset_loads
    description: Completion ledger; rows are written only after all seven tables reconcile.
    columns:
    - name: load_id
      data_tests:
      - not_null
      - unique
    - name: dataset_id
      data_tests:
      - not_null
      - unique
