[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gim-synth"
version = "0.1.0"
description = "Synthetic Genesys Info Mart (INTERACTION_RESOURCE_FACT) voice call data generator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.26", "pyarrow>=15.0", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
gim-synth = "gim_synth.cli:main"

[tool.setuptools.packages.find]
include = ["gim_synth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
